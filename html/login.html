<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginn.css">
    <style>
        .background {
            display: none;
        }
        .container, body{
            background-color: #33705f !important;
        }
    </style>
</head>
<body>
    <div class="background">
        <img src="../img/logo-zequitex-big.png" alt="fondo-logo-zequitex">
    </div>
    <div class="return">
        <a href="../index.html" class="material-symbols-outlined">arrow_back</a>
    </div>
    <div class="container">
        <div class="login-container">
            
            <form method="post" action="../php/login.php" class="login-container__form">
                <div class="login-container__form__title">
                    <h1>LOGIN</h1>
                </div>
                <div class="login-container__form__input">
                    <div class="form-part">
                        <label for="Usuario">Usuario:</label>
                        <input autocomplete="off" type="text" id="Usuario" name="UsuarioName" placeholder="Customer Name" required>
                        <span class="error-message">Por favor, ingresa tu Usuario.</span>
                    </div>
                    
                    <div class="form-part">
                        <label for="Password">Contraseña:</label>
                        <div class="password">
                            <input autocomplete="off" type="password" id="Password" name="UsuarioPassword" placeholder="Password" required>
                            <span class="material-symbols-outlined" id="see-password">visibility_off</span>
                        </div>
                        <span class="error-message">Por favor, ingresa tu contraseña.</span>
                    </div>

                    <div class="remember-container">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" id="remember-label">Recordar</label>
                        <label id="additional-label" for="remember"></label>
                    </div>

                    <a class="form-link" href="sign_in.html">Crear Cuenta</a>

                    <div class="down-part">
                        <input class="form-button" type="submit" value="ingresar">
                        <input type="reset" class="form-button">
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/logg.js"></script>
</body>
</html>
